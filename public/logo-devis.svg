<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" fill="none">
  <!-- Left Side: Lawyer & Contact Information -->
  <text x="10" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#14233C" letter-spacing="1.5">LUZ KARIME BEETAR DE DEVIS</text>
  <text x="180" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#14233C" letter-spacing="1">Abogada</text>
  <text x="65" y="98" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="400" fill="#14233C" letter-spacing="0.5">devisbeetar@outlook.com</text>
  <text x="120" y="124" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="400" fill="#14233C" letter-spacing="0.5">+57 (315) 7547997</text>
  <text x="28" y="150" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="400" fill="#14233C" letter-spacing="0.5">Barranquilla D.E.I.P. – Colombia</text>

  <!-- Right Side: Iconic DB 1962 Monogram -->
  <g transform="translate(370, 15)">
    <!-- Square Box -->
    <rect x="0" y="15" width="130" height="130" stroke="#14233C" stroke-width="2.2" fill="none" />
    
    <!-- Vertical dividing line protruding above and below -->
    <line x1="72" y1="0" x2="72" y2="160" stroke="#14233C" stroke-width="2.2" />
    
    <!-- Monogram letters D and B in serif -->
    <!-- Letter D -->
    <text x="22" y="65" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="52" font-weight="700" fill="#14233C">D</text>
    <!-- Letter B -->
    <text x="22" y="125" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="52" font-weight="700" fill="#14233C">B</text>
    
    <!-- Year 1962 rotated vertically -->
    <text x="100" y="45" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#14233C" letter-spacing="4" transform="rotate(90, 100, 45)">1962</text>
  </g>
</svg>
